[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# API プロキシ
[[redirects]]
  from = "/api/*"
  to = "https://ddxdewgmen.ap-northeast-1.awsapprunner.com/api/:splat"
  status = 200
  force = true

# サイトマップ（バックエンドから取得）
[[redirects]]
  from = "/sitemap.xml"
  to = "https://ddxdewgmen.ap-northeast-1.awsapprunner.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-blog.xml"
  to = "https://ddxdewgmen.ap-northeast-1.awsapprunner.com/sitemap-blog.xml"
  status = 200
  force = true

# SPAルーティング対応（最後に配置、静的ファイルは除外）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

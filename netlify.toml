[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  ignore = "git ls-files -m"

[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20"

# API プロキシ
[[redirects]]
  from = "/api/*"
  to = "https://ddxdewgmen.ap-northeast-1.awsapprunner.com/api/:splat"
  status = 200
  force = true

# ブログサイトマップ（バックエンドから動的取得）
[[redirects]]
  from = "/sitemap-blog.xml"
  to = "https://ddxdewgmen.ap-northeast-1.awsapprunner.com/sitemap-blog.xml"
  status = 200
  force = true

# SPAルーティング対応（最後に配置、静的ファイルとAPIは除外）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
